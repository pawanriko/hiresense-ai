# Render Blueprint: deploys the web service + Postgres in one click.
# Dashboard: New -> Blueprint -> select this repo. Render reads this
# file, creates both resources, and deploys from main on every push.
#   * Build order matters: the React app is built BEFORE collectstatic,
#     so the built files exist for Django to collect and WhiteNoise to
#     serve. Migrations run next, then seed_demo, both against the
#     Render Postgres database.
#   * SECRET_KEY is generated by Render (never committed, never the dev
#     key). DATABASE_URL comes from the database below.
#   * seed_demo runs in the build (not by hand): Render's Shell tab
#     needs a paid plan, so on the free tier the build is the way to
#     create the demo login (demo / demo1234). seed_demo is safe to
#     re-run — it refreshes the demo user instead of duplicating it.
#   * Optional env vars (add in the dashboard later): GROQ_API_KEY,
#     GEMINI_API_KEY (AI features; the app works without them),
#     GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET.
services:
  - type: web
    name: hiresense-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hiresense-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
databases:
  - name: hiresense-db
    plan: free
