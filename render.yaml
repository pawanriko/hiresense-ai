# Render Blueprint: deploys the web service + Postgres in one click.
# Dashboard: New -> Blueprint -> select this repo. Render reads this
# file, creates both resources, and deploys from main on every push.
#   * Build order matters: the React app is built BEFORE collectstatic,
#     so the built files exist for Django to collect and WhiteNoise to
#     serve. Migrations run last, against the Render Postgres database.
#   * SECRET_KEY is generated by Render (never committed, never the dev
#     key). DATABASE_URL comes from the database below.
#   * After the first deploy, run this once in the service's Shell tab
#     to create the demo login: python manage.py seed_demo
#   * Optional env vars (add in the dashboard later): GROQ_API_KEY,
#     GEMINI_API_KEY (AI features; the app works without them),
#     GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET.
services:
  - type: web
    name: hiresense-ai
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hiresense-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0
databases:
  - name: hiresense-db
    plan: free
